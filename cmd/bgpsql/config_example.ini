[grpc]
port = 7179

[sql]
database = db_name
source = bgp1

[log]
file = /var/log/bgp_sql.log

[failover]
priority = 1
peer = 192.168.1.0:7179

# Telemetry ingest validation thresholds.
# NOTE: Review and revisit these bounds annually (e.g. Q1) as the global
# BGP routing table size naturally grows over time.
[validation]
v4_min = 800000
v4_max = 1600000
v6_min = 150000
v6_max = 600000
max_delta_pct = 3.0
max_peer_diff_pct = 5.0
min_peer_ratio = 0.5
